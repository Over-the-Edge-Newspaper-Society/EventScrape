# Dev stack on Convex (Postgres/Redis/Fastify API retired).
#
# Prereq: start the self-hosted Convex backend and push functions first:
#   pnpm convex:docker:up      # backend + dashboard (docker-compose.convex.yml)
#   pnpm convex:dev            # watch + push functions (reads .env.local)
#
# Then run this file for the app services:
#   docker compose -f docker-compose.dev.yml up
#
# The admin (browser) and worker (container) both talk to the Convex backend on
# the host at :3210 via host.docker.internal.

services:
  admin:
    image: node:18-alpine
    container_name: eventscrape-admin
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      # Browser-facing Convex URL — must be reachable from your browser.
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
      NODE_ENV: development
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
    command: sh -c "npm install -g pnpm && pnpm install && cd apps/admin && pnpm dev --host 0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      eventscrape:
        aliases:
          - admin

  worker:
    image: mcr.microsoft.com/playwright:v1.54.0
    container_name: eventscrape-worker
    working_dir: /app/worker
    environment:
      # Worker (in-container) reaches the Convex backend on the host.
      CONVEX_URL: ${CONVEX_URL:-http://host.docker.internal:3210}
      NODE_ENV: development
      PLAYWRIGHT_HEADLESS: "true"
      INSTAGRAM_IMAGES_DIR: /data/instagram_images
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/worker/node_modules
      - instagram_images:/data/instagram_images
    command: sh -c "npm install -g pnpm && cd /app && pnpm install && cd /app/worker && pnpm dev"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      eventscrape:
        aliases:
          - worker

networks:
  eventscrape:
    driver: bridge

volumes:
  instagram_images:
