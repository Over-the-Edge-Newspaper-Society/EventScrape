# EventScrape now runs entirely on Convex — Postgres and Redis have been retired.
# The self-hosted Convex backend + dashboard live in docker-compose.convex.yml
# (run `pnpm convex:docker:up`). This file builds the app services that talk to it.
#
# The former Fastify API (apps/api) has been retired: the admin UI talks to Convex
# directly and the worker claims jobs from Convex. A handful of external-I/O
# features (WordPress upload, AI extraction triggers, export file generation,
# poster import, backups) are pending the "actions phase" port and are gated in
# the UI. See docs/convex-actions-tradeoffs.md and docs/convex-migration.md.

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: eventscrape-admin
    ports:
      - "${EVENTSCRAPE_HTTP_PORT:-3000}:80"
    environment:
      # Browser-facing Convex deployment URL (defaults to the self-hosted backend).
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://127.0.0.1:3210}
      NODE_ENV: production
    networks:
      - eventscrape
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: eventscrape-worker
    environment:
      # Worker claims jobs + reads/writes data over Convex (no DATABASE_URL/REDIS_URL).
      CONVEX_URL: ${CONVEX_URL:-http://host.docker.internal:3210}
      NODE_ENV: production
      PLAYWRIGHT_HEADLESS: "true"
      INSTAGRAM_IMAGES_DIR: /data/instagram_images
    volumes:
      - instagram_images:/data/instagram_images
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eventscrape
    restart: unless-stopped

networks:
  eventscrape:
    driver: bridge

volumes:
  instagram_images:
