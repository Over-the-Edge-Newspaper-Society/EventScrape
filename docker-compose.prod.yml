# Production stack on Convex (Postgres/Redis/Fastify API retired).
#
# Convex backend: use Convex Cloud OR the self-hosted backend.
#   - Convex Cloud: set CONVEX_URL + VITE_CONVEX_URL to your cloud deployment URL
#     and deploy functions with `npx convex deploy`.
#   - Self-hosted: run `pnpm convex:docker:up` (docker-compose.convex.yml) and
#     `pnpm convex:deploy`, then point CONVEX_URL/VITE_CONVEX_URL at it.
#
# VITE_CONVEX_URL is baked into the admin bundle at build time and must be the
# URL the BROWSER uses to reach Convex. CONVEX_URL is what the worker uses.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# TLS / reverse proxy: terminate in front of the admin service with your own
# proxy (the admin is a static SPA; the browser talks to Convex directly).

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?set VITE_CONVEX_URL to your Convex deployment URL}
    container_name: eventscrape-admin
    environment:
      NODE_ENV: production
    ports:
      - "${EVENTSCRAPE_HTTP_PORT:-3000}:3000"
    networks:
      eventscrape:
        aliases:
          - admin
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: eventscrape-worker
    environment:
      CONVEX_URL: ${CONVEX_URL:?set CONVEX_URL to your Convex deployment URL}
      NODE_ENV: production
      PLAYWRIGHT_HEADLESS: "true"
      INSTAGRAM_IMAGES_DIR: /data/instagram_images
    volumes:
      - instagram_images:/data/instagram_images
    networks:
      eventscrape:
        aliases:
          - worker
    restart: unless-stopped

networks:
  eventscrape:
    driver: bridge

volumes:
  instagram_images:
