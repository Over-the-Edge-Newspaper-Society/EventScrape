packages:
  - 'apps/*'
  - 'worker'
  - 'packages/*'
# These packages have install scripts (native builds / binary downloads) and
# must be allowed to run them. pnpm 10+ ERRORS on ignored build scripts rather
# than warning, which fails the Docker build with ERR_PNPM_IGNORED_BUILDS.
#
# The previous `allowBuilds:` block here contained literal placeholder text
# ("set this to true or false"), which configured nothing.
onlyBuiltDependencies:
  - better-sqlite3
  - es5-ext
  - esbuild
  - msgpackr-extract
